name: Cross Compile

# Online (GitHub-hosted) cross-compile check, called by ci-orchestrator.yml on
# the :hammer_and_wrench: gitmoji. It builds the library through Conan with a
# generated cross profile -- README's `conan create . -pr:h=<profile> -tf=` flow,
# using benchmark/script/run_bench.py's profile conventions -- and reports the
# architecture of the produced archives. No board and no test folder.
# The on-board route (real hardware, self-hosted runner) is hetai-package-matrix.yml.
on:
  workflow_call:
    inputs:
      pkg_name:
        description: 'Package name from metadata.json'
        required: true
        type: string

env:
  CONAN_HOME: ~/.conan2
  # readelf prints localized field names, which would break the parsing
  LC_ALL: C

jobs:
  cross-compile:
    name: Cross Compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Backstop: the apt step below is the only network-dependent step here, and a single
    # stalled mirror would otherwise hold the job -- and the push-triggered concurrency
    # group -- for the default 360 minutes. Mirrors the 55-minute backstops in
    # ci-build-test.yml / full-test-automation.yml.
    timeout-minutes: 40
    strategy:
      # fail-fast off: each target must report its own result
      fail-fast: false
      matrix:
        include:
          # A-core / arm-linux (OS present) and M-core / baremetal (no OS)
          # NOTE: the g++ driver is a separate package for the Linux targets
          # (gcc-aarch64-linux-gnu ships only the C compiler); arm-none-eabi
          # bundles both, hence the asymmetry.
          - target: arm-linux-a53
            packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          - target: mcu-m4
            packages: gcc-arm-none-eabi

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Conan
        shell: bash
        run: |
          pip install --only-binary :all: conan==2.31.2

      - name: Cache the cross toolchain debs
        uses: actions/cache@v6
        with:
          path: ~/.cache/apt-archives
          # Keyed on this file: the package set lives in the matrix below and the versions live in the
          # runner image, so editing either starts a fresh cache instead of serving an old deb set.
          key: apt-debs-${{ matrix.target }}-${{ hashFiles('.github/workflows/cross-compile.yml') }}

      - name: Install the cross toolchain and the Conan default profile
        shell: bash
        # apt is the flakiest part of a hosted runner: a stalled mirror turns into the
        # default 360-minute step limit, so bound the step and let retries + timeouts do
        # the work. The options go into apt.conf.d so they apply to update AND install.
        timeout-minutes: 12
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-retries >/dev/null
          # Run 40840909635 spent 377 s of its 489 s apt step fetching 607 MB at 1.3 MB/s and ~10 s
          # unpacking, so the download is the only part worth caching -- the debs are content-addressed
          # by version, apt re-verifies the size and hash, and a stale entry just gets re-fetched.
          sudo mkdir -p /var/cache/apt/archives/partial
          if compgen -G "$HOME/.cache/apt-archives/*.deb" >/dev/null; then
            sudo cp "$HOME"/.cache/apt-archives/*.deb /var/cache/apt/archives/
            echo "seeded $(find "$HOME/.cache/apt-archives" -name '*.deb' | wc -l) cached archives"
          fi
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
          # Re-save exactly the version set this job used, so a mirror bump replaces instead of grows it.
          # Only reached after apt succeeded, so the cache can never pin a tree that does not install.
          rm -rf "$HOME/.cache/apt-archives"
          mkdir -p "$HOME/.cache/apt-archives"
          cp /var/cache/apt/archives/*.deb "$HOME/.cache/apt-archives/"
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-cross-${{ matrix.target }}-${{ hashFiles('conanfile.py', 'conandata.yml', 'metadata.json') }}
          restore-keys: |
            conan-cross-${{ matrix.target }}-

      - name: Cross-compile and check the artifact architecture
        shell: bash
        run: python3 .github/misc/cross_compile_check.py --target ${{ matrix.target }}
