name: Docs

# Called by ci-orchestrator.yml, or run manually via workflow_dispatch.

on:
  workflow_call:
    # No inputs needed - documentation build is self-contained
  workflow_dispatch:

env:
  CONAN_HOME: ~/.conan2

jobs:
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install documentation dependencies
        run: |
          sudo apt install -y doxygen graphviz
          pip install --only-binary :all: numpy==2.1.3 sphinx==7.4.7 sphinx-intl==2.2.0 sphinx-rtd-theme==2.0.0

      - name: Build documentation
        run: |
          set -o pipefail
          python ./docs/build.py 2>&1 | tee /tmp/documentation.log
          # Sphinx exits 0 on a parse failure and only prints `ERROR: `, so the marker decides, not the status; the wording is Sphinx's, so this line moves with the tool, not with a shared script.
          if grep -nE '(^| )ERROR: ' /tmp/documentation.log; then
            echo "::error::the documentation build reported an error (see the ERROR line above)"
            exit 1
          fi

      - name: Assert the documentation was produced
        shell: bash
        run: |
          status=0
          for f in docs/doxygen/build/docs.html docs/sphinx/build/html/index.html; do
            if [ -f "$f" ]; then echo "ok: $f"; else echo "::error::missing documentation artifact: $f"; status=1; fi
          done
          # DOT_PATH is empty by design, so `dot` must be resolvable from PATH
          if command -v dot >/dev/null 2>&1; then echo "ok: $(dot -V 2>&1)"; else echo "::error::graphviz 'dot' is not on PATH"; status=1; fi
          exit $status
